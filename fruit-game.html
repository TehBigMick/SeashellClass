<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seashell Fruit & Veg Game</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #e8f7ff, #ffffff);
    text-align: center;
  }

  .container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
  }

  h1 {
    color: #1f6fb2;
  }

  .card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  }

  .game-container {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 20px auto;
    border-radius: 16px;
    overflow: hidden;
  }

  #mainImage {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* GRID */
  .grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }

  .tile {
    background: #4aa3ff;
    border: 2px solid white;
    cursor: pointer;
    transition: opacity 0.3s ease;
  }

  .tile:hover {
    background: #2d7ef7;
  }

  .clue {
    font-size: 22px;
    margin: 10px 0;
    color: #1f6fb2;
    font-weight: bold;
  }

  button {
    background: #4aa3ff;
    color: white;
    border: none;
    padding: 12px 16px;
    margin: 6px;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 3px 0 #2d7ef7;
  }

  button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #2d7ef7;
  }
</style>
</head>

<body>

<div class="container">
  <h1>🍓 Fruit & Veg Reveal Game</h1>

  <div class="card">

    <div class="clue" id="clueText">Starts with...</div>

    <div class="game-container">
      <img id="mainImage" src="" alt="hidden image">

      <div class="grid" id="grid">

        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>

        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>

        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>

      </div>
    </div>

    <button onclick="nextWord()">Next Word</button>
    <button onclick="revealAll()">Reveal All</button>

  </div>
</div>

<script>

const wordBank = [
  "potato",
  "carrot",
  "broccoli",
  "pea",
  "tomato",
  "cucumber",
  "eggplant",
  "watermelon",
  "pear",
  "grapefruit",
  "pineapple",
  "strawberry"
];

let currentWord = "";

function nextWord() {
  const index = Math.floor(Math.random() * wordBank.length);
  currentWord = wordBank[index];

  document.getElementById("mainImage").src =
    `/assets/images/${currentWord}.png`;

  const letter = currentWord.charAt(0).toUpperCase();
  document.getElementById("clueText").textContent =
    `Starts with: ${letter}`;

  resetGrid();
}

function resetGrid() {
  document.querySelectorAll(".tile").forEach(tile => {
    tile.style.opacity = 1;
    tile.style.pointerEvents = "auto";
  });
}

function removeTile(tile) {
  tile.style.opacity = 0;
  tile.style.pointerEvents = "none";
}

function revealAll() {
  document.querySelectorAll(".tile").forEach(tile => {
    tile.style.opacity = 0;
    tile.style.pointerEvents = "none";
  });
}

nextWord();

</script>

</body>
</html>

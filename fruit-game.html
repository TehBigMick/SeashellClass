<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seashell Fruit &amp; Veg Game</title>
<link rel="stylesheet" href="/styles.css">
<script src="/scripts/site.js" defer></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #e8f7ff, #ffffff);
    text-align: center;
  }

  .container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
  }

  h1 {
    color: #1f6fb2;
    margin-bottom: 5px;
  }

  .subtitle {
    color: #4aa3ff;
    margin-bottom: 10px;
  }

  .card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  }

  .clue {
    font-size: 22px;
    margin: 10px 0;
    color: #1f6fb2;
    font-weight: bold;
  }

  .game-container {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 20px auto;
    border-radius: 16px;
    overflow: hidden;
  }

  #mainImage {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #f8fbff;
  }

  .grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }

  .tile {
    background: #4aa3ff;
    border: 2px solid white;
    cursor: pointer;
    transition: all 0.25s ease;

    /* NEW label styling */
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    color: white;
    user-select: none;
  }

  .tile:hover {
    background: #2d7ef7;
  }

  button {
    background: #4aa3ff;
    color: white;
    border: none;
    padding: 12px 16px;
    margin: 6px;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 3px 0 #2d7ef7;
  }

  button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #2d7ef7;
  }

  select {
    padding: 10px;
    border-radius: 10px;
    margin-top: 10px;
    border: 1px solid #ccc;
  }
</style>
</head>

<body>

<div class="container">

  <h1>🍓 Fruit &amp; Veg Reveal Game</h1>
  <div class="subtitle">Call out the number or letter to choose a square</div>

  <div class="card">

    <!-- MODE SELECTOR -->
    <div>
      <label><strong>Tile Mode:</strong></label><br>
      <select id="modeSelect" onchange="nextWord()">
        <option value="numbers">Numbers (1–20)</option>
        <option value="letters">Letters (a–z)</option>
      </select>
    </div>

    <div class="clue" id="clueText">Starts with...</div>

    <div class="game-container">

      <img id="mainImage" src="/assets/images/potato.webp" alt="Hidden food to guess">

      <div class="grid" id="grid">

        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>

        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>

        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>
        <div class="tile" onclick="removeTile(this)"></div>

      </div>

    </div>

    <div>
      <button type="button" onclick="nextWord()">Next Word</button>
      <button type="button" onclick="revealAll()">Reveal All</button>
    </div>

  </div>
</div>

<script>

const wordBank = [
  "potato",
  "carrot",
  "broccoli",
  "pea",
  "tomato",
  "cucumber",
  "eggplant",
  "watermelon",
  "pear",
  "grapefruit",
  "pineapple",
  "strawberry"
];

let currentWord = "";
let remainingTiles = [];
let currentAudio = null;

function nextWord() {

  const index = Math.floor(Math.random() * wordBank.length);
  currentWord = wordBank[index];

  document.getElementById("mainImage").src =
    `/assets/images/${currentWord}.webp`;

  const letter = currentWord.charAt(0).toUpperCase();
  document.getElementById("clueText").textContent =
    `Starts with: ${letter}`;

  resetGrid();
  assignTileLabels();

  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
}

function resetGrid() {
  const tiles = document.querySelectorAll(".tile");

  tiles.forEach(tile => {
    tile.style.opacity = 1;
    tile.style.pointerEvents = "auto";
  });

  remainingTiles = Array.from(tiles);
}

/* NEW: assign numbers or letters */
function assignTileLabels() {

  const mode = document.getElementById("modeSelect").value;
  const tiles = document.querySelectorAll(".tile");

  let pool = [];

  if (mode === "numbers") {
    for (let i = 1; i <= 20; i++) pool.push(i);
  } else {
    for (let i = 97; i <= 122; i++) {
      pool.push(String.fromCharCode(i));
    }
  }

  // shuffle pool
  pool.sort(() => Math.random() - 0.5);

  tiles.forEach((tile, i) => {
    tile.textContent = pool[i];
  });
}

function removeTile(tile) {

  if (tile.style.opacity === "0") return;

  tile.style.opacity = 0;
  tile.style.pointerEvents = "none";

  remainingTiles = remainingTiles.filter(t => t !== tile);

  if (remainingTiles.length === 0) {
    playWordAudio();
  }
}

function revealAll() {

  document.querySelectorAll(".tile").forEach(tile => {
    tile.style.opacity = 0;
    tile.style.pointerEvents = "none";
  });

  remainingTiles = [];

  playWordAudio();
}

function playWordAudio() {

  const audioPath = `/assets/audio/words/${currentWord}.m4a`;

  currentAudio = new Audio(audioPath);

  currentAudio.play().catch(err => {
    console.log("Audio playback issue:", err);
  });
}

nextWord();

</script>

</body>
</html>

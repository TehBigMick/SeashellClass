<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seashell Fruit & Veg Game</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #e8f7ff, #ffffff);
    text-align: center;
  }

  .container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
  }

  h1 {
    color: #1f6fb2;
    margin-bottom: 5px;
  }

  .subtitle {
    color: #4aa3ff;
    margin-bottom: 15px;
  }

  /* Seashell card style */
  .card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  }

  .game-container {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 20px auto;
    border-radius: 16px;
    overflow: hidden;
  }

  #mainImage {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* grid overlay */
  .grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }

  .tile {
    background: #4aa3ff;
    border: 2px solid white;
    transition: opacity 0.3s ease;
  }

  .clue {
    font-size: 22px;
    margin: 10px 0;
    color: #1f6fb2;
    font-weight: bold;
  }

  .controls {
    margin-top: 15px;
  }

  /* bubble buttons (matches your hub style) */
  button {
    background: #4aa3ff;
    color: white;
    border: none;
    padding: 12px 16px;
    margin: 6px;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 3px 0 #2d7ef7;
  }

  button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #2d7ef7;
  }

  button:hover {
    background: #2d7ef7;
  }
</style>
</head>

<body>

<div class="container">
  <h1>🍓 Fruit & Veg Reveal Game</h1>
  <div class="subtitle">Can you guess the hidden food?</div>

  <div class="card">

    <div class="clue" id="clueText">Starts with...</div>

    <div class="game-container">
      <img id="mainImage" src="" alt="hidden image">

      <div class="grid" id="grid">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>
    </div>

    <div class="controls">
      <button onclick="removeRandomTile()">Remove Square</button>
      <button onclick="revealAll()">Reveal All</button>
      <button onclick="nextWord()">Next Word</button>
    </div>

  </div>
</div>

<script>

const wordBank = [
  "potato",
  "carrot",
  "broccoli",
  "pea",
  "tomato",
  "cucumber",
  "eggplant",
  "watermelon",
  "pear",
  "grapefruit",
  "pineapple",
  "strawberry"
];

let currentWord = "";
let remainingTiles = [];

function nextWord() {
  const index = Math.floor(Math.random() * wordBank.length);
  currentWord = wordBank[index];

  document.getElementById("mainImage").src = `/assets/images/${currentWord}.png;

  // LETTER CLUE
  const firstLetter = currentWord.charAt(0).toUpperCase();
  document.getElementById("clueText").textContent =
    `Starts with: ${firstLetter}`;

  resetGrid();
}

function resetGrid() {
  const tiles = document.querySelectorAll(".tile");

  tiles.forEach(t => t.style.opacity = 1);

  remainingTiles = Array.from(tiles);
}

function removeRandomTile() {
  if (remainingTiles.length === 0) return;

  const index = Math.floor(Math.random() * remainingTiles.length);
  const tile = remainingTiles.splice(index, 1)[0];

  tile.style.opacity = 0;
}

function revealAll() {
  document.querySelectorAll(".tile").forEach(t => t.style.opacity = 0);
  remainingTiles = [];
}

// start
nextWord();

</script>

</body>
</html>

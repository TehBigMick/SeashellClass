<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Listen to a word and build it from phoneme tiles.">
  <title>Build the Word | Seashell Class</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/scripts/site.js" defer></script>
</head>
<body>
  <main class="activity-shell" id="main-content">
    <header class="activity-heading"><span class="eyebrow">Phonics · Blending</span><h1>Build the Word</h1><p>Listen to the word, then tap its sounds in the correct order.</p></header>
    <section class="activity-card" aria-labelledby="word-prompt">
      <div class="activity-toolbar"><label>Word set <select id="level-select"><option value="level1">Level 1</option><option value="level2">Level 2</option><option value="level3">Level 3</option></select></label><span class="score-pill" id="score">Words: 0</span></div>
      <div class="prompt-panel"><h2 id="word-prompt">Listen and build</h2><p id="word-slots" class="sentence-frame" role="status"></p><div class="control-row"><button class="button button--coral" id="listen-button" type="button">🔊 Hear the word</button></div></div>
      <div class="phoneme-row" id="game-area" role="group" aria-label="Phoneme choices"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="control-row"><button class="button" id="next-button" type="button" hidden>Next word →</button><button class="button button--light" id="reset-button" type="button">New word</button></div>
    </section>
  </main>
  <script src="/phonics-data.js"></script>
  <script src="/phonics-engine.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pirate Pat - Interactive Book</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="pirate-pat.css">
  <script src="/scripts/site.js" defer></script>
</head>
<body>
  <main class="book-page-shell" id="main-content">
  <header class="book-heading"><span class="eyebrow">Decodable story · Level 1</span><h1>Pirate Pat</h1><p>Adult reads the story; child taps and blends the short words.</p></header>
  <div class="book-container">
    <!-- Previous Page -->
    <button type="button" class="nav-button" id="prev-page">‹</button>

    <!-- Page Content -->
    <div class="page" id="page-container">
      <!-- Teacher Section -->
      <div class="teacher-section">
        <img id="page-image" src="/assets/images/pirate-pat-1.webp" alt="Pirate Pat story page">
        <p id="teacher-text"></p>
        <button type="button" class="play-audio" id="play-teacher">🔊 Read Story</button>
      </div>

      <!-- Student Section -->
      <div class="student-section">
        <div id="cvc-words">
          <!-- Letter buttons + Play Word buttons dynamically generated by JS -->
        </div>
      </div>
    </div>

    <!-- Next Page -->
    <button type="button" class="nav-button" id="next-page">›</button>
  </div>
  <p class="page-indicator" id="page-indicator" aria-live="polite"></p>
  </main>

  <!-- JS -->
  <script src="pirate-pat.js"></script>
</body>
</html>

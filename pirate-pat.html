<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pirate Pat - Interactive Book</title>
  <link rel="stylesheet" href="pirate-pat.css">
  <style>
    /* ===== Kid-friendly Styles ===== */
    body {
      font-family: 'Comic Sans MS', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
      background: #e0f7fa;
    }

    .book-container {
      display: flex;
      align-items: center;
    }

    .nav-button {
      font-size: 3em;
      background: #ffcc00;
      border: 2px solid #f0a500;
      border-radius: 50%;
      padding: 10px 20px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s;
    }

    .nav-button:hover {
      transform: scale(1.2);
    }

    .page {
      width: 600px;
      margin: 0 20px;
      padding: 20px;
      background: #fffde7;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      text-align: center;
    }

    .teacher-section img {
      max-width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 3px solid #f0a500;
    }

    .teacher-section p {
      font-size: 1.2em;
      margin-bottom: 10px;
      white-space: pre-line;
    }

    .teacher-section button,
    .student-section button {
      margin: 5px;
      padding: 10px 15px;
      border-radius: 25px;
      border: none;
      background-color: #ffcc00;
      cursor: pointer;
      font-size: 1em;
      transition: transform 0.2s;
    }

    .teacher-section button:hover,
    .student-section button:hover {
      transform: scale(1.1);
    }

    .student-section {
      margin-top: 20px;
    }

    #cvc-words {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 10px;
    }

    .cvc-button {
      margin: 5px;
      min-width: 60px;
    }

    #play-all-words {
      background-color: #4caf50;
      color: white;
      padding: 10px 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="book-container">
    <!-- Previous Page -->
    <button class="nav-button" id="prev-page">‹</button>

    <!-- Page Content -->
    <div class="page" id="page-container">
      <!-- Teacher Section -->
      <div class="teacher-section">
        <img id="page-image" src="" alt="Page Image">
        <p id="teacher-text"></p>
        <button class="play-audio" id="play-teacher">🔊 Play Story</button>
      </div>

      <!-- Student Section -->
      <div class="student-section">
        <div id="cvc-words">
          <!-- CVC word buttons generated by JS -->
        </div>
        <button id="play-all-words">🔊 Play All Words</button>
      </div>
    </div>

    <!-- Next Page -->
    <button class="nav-button" id="next-page">›</button>
  </div>

  <!-- JS -->
  <script src="pirate-pat.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic Story</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/scripts/site.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }
    h1, h2, h3 {
      margin-bottom: 15px;
    }

    /* Vocabulary Flashcards */
    .flashcards-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }
    .flashcard {
      background-color: #f1f1f1;
      border-radius: 10px;
      padding: 10px;
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .flashcard img {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
      margin-bottom: 8px;
    }
    .flashcard span {
      font-weight: bold;
      margin-bottom: 6px;
    }
    .flashcard button {
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 16px;
    }
    .flashcard button:hover {
      background-color: #0b7dda;
    }

    /* Comic Board */
    .comic-board {
      border: 2px dashed #4CAF50;
      height: 400px;
      margin-bottom: 20px;
      position: relative;
      background-size: cover;
      background-position: center;
    }

    /* Background Selector */
    .background-selector {
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .background-selector button {
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid #4CAF50;
      cursor: pointer;
      background-color: white;
      transition: 0.2s;
    }
    .background-selector button:hover {
      background-color: #4CAF50;
      color: white;
    }

    /* Character Palette */
    .character-palette {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }
    .character-palette img {
      width: 80px;
      height: 80px;
      cursor: grab;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h1>📖 Comic Story</h1>
  <p>Learn the characters and drag them onto different backgrounds!</p>

  <!-- Vocabulary Flashcards -->
  <h2>Vocabulary Basics</h2>
  <div class="flashcards-container">
    <div class="flashcard"><img src="/assets/images/lion.webp" alt="Lion"><span>Lion</span><button type="button" onclick="playAudio('lion')">🔊</button></div>
    <div class="flashcard"><img src="/assets/images/cat.webp" alt="Cat"><span>Cat</span><button type="button" onclick="playAudio('cat')">🔊</button></div>
    <div class="flashcard"><img src="/assets/images/dog.webp" alt="Dog"><span>Dog</span><button type="button" onclick="playAudio('dog')">🔊</button></div>
    <div class="flashcard"><img src="/assets/images/superhero.webp" alt="Superhero"><span>Superhero</span><button type="button" onclick="playAudio('superhero')">🔊</button></div>
    <div class="flashcard"><img src="/assets/images/princess.webp" alt="Princess"><span>Princess</span><button type="button" onclick="playAudio('princess')">🔊</button></div>
    <div class="flashcard"><img src="/assets/images/astronaut.webp" alt="Astronaut"><span>Astronaut</span><button type="button" onclick="playAudio('astronaut')">🔊</button></div>
    <div class="flashcard"><img src="/assets/images/pirate.webp" alt="Pirate"><span>Pirate</span><button type="button" onclick="playAudio('pirate')">🔊</button></div>
    <div class="flashcard"><img src="/assets/images/fairy.webp" alt="Fairy"><span>Fairy</span><button type="button" onclick="playAudio('fairy')">🔊</button></div>
    <div class="flashcard"><img src="/assets/images/dragon.webp" alt="Dragon"><span>Dragon</span><button type="button" onclick="playAudio('dragon')">🔊</button></div>
    <div class="flashcard"><img src="/assets/images/robot.webp" alt="Robot"><span>Robot</span><button type="button" onclick="playAudio('robot')">🔊</button></div>
  </div>

  <!-- Background Selector -->
  <h3>Select Background</h3>
  <div class="background-selector">
    <button type="button" onclick="changeBackground(1)">Background 1</button>
    <button type="button" onclick="changeBackground(2)">Background 2</button>
    <button type="button" onclick="changeBackground(3)">Background 3</button>
    <button type="button" onclick="changeBackground(4)">Background 4</button>
    <button type="button" onclick="changeBackground(5)">Background 5</button>
  </div>

  <!-- Comic Board -->
  <div class="comic-board comic-board--default" id="comic-board"></div>

  <!-- Character Palette -->
  <h3>Character Palette</h3>
  <div class="character-palette">
    <img src="/assets/images/lion.webp" alt="Lion" draggable="true" id="drag-lion" class="draggable">
    <img src="/assets/images/cat.webp" alt="Cat" draggable="true" id="drag-cat" class="draggable">
    <img src="/assets/images/dog.webp" alt="Dog" draggable="true" id="drag-dog" class="draggable">
    <img src="/assets/images/superhero.webp" alt="Superhero" draggable="true" id="drag-superhero" class="draggable">
    <img src="/assets/images/princess.webp" alt="Princess" draggable="true" id="drag-princess" class="draggable">
    <img src="/assets/images/astronaut.webp" alt="Astronaut" draggable="true" id="drag-astronaut" class="draggable">
    <img src="/assets/images/pirate.webp" alt="Pirate" draggable="true" id="drag-pirate" class="draggable">
    <img src="/assets/images/fairy.webp" alt="Fairy" draggable="true" id="drag-fairy" class="draggable">
    <img src="/assets/images/dragon.webp" alt="Dragon" draggable="true" id="drag-dragon" class="draggable">
    <img src="/assets/images/robot.webp" alt="Robot" draggable="true" id="drag-robot" class="draggable">
  </div>

  <audio id="audio-player"></audio>

  <script>
    const board = document.getElementById('comic-board');

    // Play audio
    function playAudio(word) {
      const audio = document.getElementById('audio-player');
      audio.src = `/assets/audio/words/${word}.m4a`;
      audio.play();
    }

    // Drag from palette -> board
    const draggables = document.querySelectorAll('.draggable');
    draggables.forEach(item => item.addEventListener('dragstart', dragStart));
    board.addEventListener('dragover', dragOver);
    board.addEventListener('drop', dropItem);

    function dragStart(e) {
      e.dataTransfer.setData('text/plain', e.target.id);
    }

    function dragOver(e) {
      e.preventDefault();
    }

    function dropItem(e) {
      e.preventDefault();
      const id = e.dataTransfer.getData('text');
      const draggedEl = document.getElementById(id).cloneNode(true);

      // Scale dropped character
      const boardWidth = board.clientWidth;
      const scale = boardWidth / 900;
      draggedEl.style.width = `${80 * scale}px`;
      draggedEl.style.height = `${80 * scale}px`;

      draggedEl.style.position = 'absolute';
      draggedEl.style.left = `${e.offsetX - (40 * scale)}px`;
      draggedEl.style.top = `${e.offsetY - (40 * scale)}px`;
      draggedEl.style.cursor = 'move';
      draggedEl.classList.remove('draggable');

      // Make it movable (mouse + touch)
      makeMovable(draggedEl);

      board.appendChild(draggedEl);
    }

    function makeMovable(elem) {
      let offsetX, offsetY;

      // Mouse events
      elem.addEventListener('mousedown', startMove);
      function startMove(e) {
        offsetX = e.clientX - elem.getBoundingClientRect().left;
        offsetY = e.clientY - elem.getBoundingClientRect().top;
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', stopMove);
      }
      function move(e) {
        moveAt(e.clientX, e.clientY);
      }
      function stopMove() {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', stopMove);
      }

      // Touch events
      elem.addEventListener('touchstart', startTouchMove);
      function startTouchMove(e) {
        const touch = e.touches[0];
        offsetX = touch.clientX - elem.getBoundingClientRect().left;
        offsetY = touch.clientY - elem.getBoundingClientRect().top;
        document.addEventListener('touchmove', touchMove, { passive: false });
        document.addEventListener('touchend', stopTouchMove);
      }
      function touchMove(e) {
        e.preventDefault();
        const touch = e.touches[0];
        moveAt(touch.clientX, touch.clientY);
      }
      function stopTouchMove() {
        document.removeEventListener('touchmove', touchMove);
        document.removeEventListener('touchend', stopTouchMove);
      }

      function moveAt(clientX, clientY) {
        const rect = board.getBoundingClientRect();
        let left = clientX - rect.left - offsetX;
        let top = clientY - rect.top - offsetY;
        left = Math.max(0, Math.min(left, board.clientWidth - elem.offsetWidth));
        top = Math.max(0, Math.min(top, board.clientHeight - elem.offsetHeight));
        elem.style.left = left + 'px';
        elem.style.top = top + 'px';
      }
    }

    // Change background
    function changeBackground(number) {
      board.style.backgroundImage = `url('/assets/images/background-${number}.webp')`;
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Perfect Pet - Interactive Book</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="pirate-pat.css">
  <script src="/scripts/site.js" defer></script>
</head>
<body>
  <main class="book-page-shell" id="main-content">
  <header class="book-heading"><span class="eyebrow">Decodable story · Level 3</span><h1>The Perfect Pet</h1><p>Adult reads the longer text; child reads the bold line.</p></header>
  <div class="book-container">
    <!-- Previous Page -->
    <button type="button" class="nav-button" id="prev-page">‹</button>

    <!-- Page Content -->
    <div class="page" id="page-container">
      <!-- Teacher Section -->
      <div class="teacher-section">
        <img id="page-image" src="/assets/images/perfect-pet1.webp" alt="The Perfect Pet story page">
        <p id="teacher-text"></p>
        <button type="button" class="play-audio" id="play-teacher">🔊 Read Story</button>
      </div>

      <!-- Student Section -->
      <div class="student-section">
        <p id="student-text"></p>
        <div id="cvc-words">
          <!-- Letter buttons + Play Word buttons dynamically generated by JS if needed -->
        </div>
      </div>
    </div>

    <!-- Next Page -->
    <button type="button" class="nav-button" id="next-page">›</button>
  </div>
  <p class="page-indicator" id="page-indicator" aria-live="polite"></p>
  </main>

  <!-- JS -->
  <script>
    const pages = [
      {image: "perfect-pet1.webp", teacher: "", student: "", audio: ""}, // Title page
      {
        image: "perfect-pet2.webp",
        teacher: `Nell doesn't care for shopping.
"Dad! Are we finished yet?"
She sees a store that looks more fun.`,
        student: `Can I go in and pick a pet?`,
        audio: "perfect2.m4a"
      },
      {
        image: "perfect-pet3.webp",
        teacher: `Here's Tess and Ted.
They're glad to help,
with pets both small and big.`,
        student: `"A dog is a lot of fun."
"A pup can beg and dig."`,
        audio: "perfect3.m4a"
      },
      {
        image: "perfect-pet4.webp",
        teacher: `Dad's not so sure.
"Dogs make a mess.
And who would clean it up?"
Nell begs and pleads,
but Dad won't budge.`,
        student: `No, Nell, not a pup.`,
        audio: "perfect4.m4a"
      },
      {
        image: "perfect-pet5.webp",
        teacher: `"Well, how about a snake?" says Ted.
"Sid's very friendly, miss."
Sid ties himself around Dad's neck.`,
        student: `Pat him.
Let him hiss.`,
        audio: "perfect5.m4a"
      },
      {
        image: "perfect-pet6.webp",
        teacher: `A parrot snatches at Dad's cap,
And perches on a rack.
"No need to worry, sir," says Tess.`,
        student: `Ted can get it back.`,
        audio: "perfect6.m4a"
      },
      {
        image: "perfect-pet7.webp",
        teacher: `Dad helps Ted chase the parrot.
They just can't jump high enough.
Ted tries to catch it in a net.`,
        student: `Dad and Ted huff and puff.`,
        audio: "perfect7.m4a"
      },
      {
        image: "perfect-pet8.webp",
        teacher: `Nell sees a bat hang upside down.
It looks so very still,
Dad thinks there's something wrong with it.`,
        student: `Tess, tell us, is it ill?`,
        audio: "perfect8.m4a"
      },
      {
        image: "perfect-pet9.webp",
        teacher: `"He's only sleeping, sir," says Tess.
"Bats do a lot of that."
"I think he's really cute," says Nell.`,
        student: `Dad, can I get a bat?`,
        audio: "perfect9.m4a"
      },
      {
        image: "perfect-pet10.webp",
        teacher: `Nell counts out all her money, but-
"That's not enough," says Tess.
Then Ted finds something cheaper.
"Look!"`,
        student: `A bug on a log is less.`,
        audio: "perfect10.m4a"
      },
      {
        image: "perfect-pet11.webp",
        teacher: `"Is this the pet you want?" asks Dad.
Nell nods and smiles, "You bet!
That was the greatest shopping trip."`,
        student: `I had fun and I got a pet.`,
        audio: "perfect11.m4a"
      }
    ];

    let currentPage = 0;

    const imgEl = document.getElementById('page-image');
    const teacherEl = document.getElementById('teacher-text');
    const studentEl = document.getElementById('student-text');
    const audioEl = new Audio();

    function loadPage(page) {
      imgEl.src = `assets/images/${pages[page].image}`;
      teacherEl.textContent = pages[page].teacher;
      studentEl.textContent = pages[page].student;
      audioEl.src = pages[page].audio ? `assets/audio/words/${pages[page].audio}` : '';
      document.getElementById('page-indicator').textContent = `Page ${page + 1} of ${pages.length}`;
      document.getElementById('prev-page').disabled = page === 0;
      document.getElementById('next-page').disabled = page === pages.length - 1;
      document.getElementById('play-teacher').hidden = !pages[page].audio;
    }

    document.getElementById('next-page').addEventListener('click', () => {
      if (currentPage < pages.length - 1) currentPage++;
      loadPage(currentPage);
    });

    document.getElementById('prev-page').addEventListener('click', () => {
      if (currentPage > 0) currentPage--;
      loadPage(currentPage);
    });

    document.getElementById('play-teacher').addEventListener('click', () => {
      if (audioEl.src) {
        audioEl.play().catch(() => {
          if (!('speechSynthesis' in window)) return;
          speechSynthesis.cancel();
          const speech = new SpeechSynthesisUtterance(pages[currentPage].teacher);
          speech.lang = 'en-GB';
          speech.rate = 0.76;
          speechSynthesis.speak(speech);
        });
      }
    });

    // Initialize first page
    loadPage(currentPage);
  </script>
</body>
</html>

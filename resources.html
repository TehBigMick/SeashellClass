<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seashell Class Resources</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Bubble button style */
    .bubble-button {
      display: inline-block;
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      margin: 8px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      text-align: center;
      transition: background-color 0.2s;
    }
    .bubble-button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <header>
    <h1>Seashell Class Resources</h1>
  </header>

  <main>
    <h2>ESL Resources</h2>
    <div id="esl-bubbles">
      <!-- ESL bubbles will be injected here -->
    </div>
  </main>

  <script>
    // Define ESL resources
    const eslResources = [
      { name: "Opposites", icon: "🔄", url: "opposites.html" },
      { name: "Hobbies", icon: "🎳", url: "hobbies.html" },
      { name: "How are you today?", icon: "😊", url: "how-are-you.html" },
      { name: "Weather", icon: "☀️", url: "weather.html" },
      { name: "What's wrong?", icon: "🤒", url: "whats-wrong.html" },
      { name: "Supertato", icon: "🥔", url: "supertato.html" }
    ];

    const eslContainer = document.getElementById("esl-bubbles");

    eslResources.forEach(resource => {
      const bubble = document.createElement("div");
      bubble.className = "bubble-button";
      bubble.innerHTML = `${resource.icon} ${resource.name}`;
      bubble.onclick = () => {
        window.location.href = resource.url;
      };
      eslContainer.appendChild(bubble);
    });
  </script>

</body>
</html>

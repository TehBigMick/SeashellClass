<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seashell Class Resources</title>

  <!-- Use root path so it works everywhere -->
  <link rel="stylesheet" href="/styles.css">
</head>

<body>

<div class="container">

  <!-- HEADER CARD -->
  <div class="card hero-card">

    <div class="logo-wrap">
      <img src="/assets/seashell-banner.webp" alt="Seashell Class Banner" class="hero-logo">
    </div>

    <h1>📚 Seashell Class Resources</h1>
    <p class="subtitle">Choose a category below</p>

    <a href="/index.html">
      <button class="bubble-btn">⬅ Back to Homepage</button>
    </a>

  </div>

  <!-- PHONICS -->
  <div class="card">
    <button class="bubble-btn large-btn" onclick="toggleLinks('phonics-links')">
      🎵 Phonics
    </button>

    <div id="phonics-links" class="sub-buttons">

      <!-- LEVEL 1 + PIRATE PAT -->
      <div style="display:flex; gap:10px; width:100%; justify-content:center; flex-wrap:wrap;">
        <a href="/resources/phonics-level1.html" class="sub-bubble">Level 1</a>
        <a href="/pirate-pat.html" class="sub-bubble">📖 Pirate Pat</a>
      </div>

      <!-- LEVEL 2 + DRESSING UP -->
      <div style="display:flex; gap:10px; width:100%; justify-content:center; flex-wrap:wrap;">
        <a href="/resources/phonics-level2.html" class="sub-bubble">Level 2</a>
        <a href="/dressing-up.html" class="sub-bubble">👗 Dressing Up</a>
      </div>

      <!-- LEVEL 3 -->
      <a href="/resources/phonics-level3.html" class="sub-bubble">Level 3</a>

    </div>
  </div>

  <!-- ESL -->
  <div class="card">
    <button class="bubble-btn large-btn" onclick="toggleLinks('esl-links')">
      🐾 ESL
    </button>

    <div id="esl-links" class="sub-buttons">
      <a href="/resources/esl-i-have-a-pet.html" class="sub-bubble">I Have a Pet</a>
      <a href="/resources/supertato.html" class="sub-bubble">Supertato!</a>
    </div>
  </div>

</div>

<script>
function toggleLinks(id) {
  const el = document.getElementById(id);
  el.style.display = (el.style.display === "flex") ? "none" : "flex";
}
</script>

</body>
</html>

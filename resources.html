<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seashell Class Resources</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="assets/seashell-banner.webp" alt="Seashell Class Banner" class="banner">
    <h1>Seashell Class Resources</h1>
    <p>Click a category to view available materials</p>
    <a href="index.html" class="back-link">← Back to Homepage</a>
  </header>

  <main>
    <!-- Phonics Category -->
    <div class="resource-button" onclick="toggleLinks('phonics-links')">
      Phonics
    </div>
    <div id="phonics-links" class="sub-buttons">
      <a href="resources/phonics-level1.html" class="sub-button">Level 1</a>
      <a href="resources/phonics-level2.html" class="sub-button">Level 2</a>
      <a href="resources/phonics-level3.html" class="sub-button">Level 3</a>
    </div>

    <!-- ESL Category -->
    <div class="resource-button" onclick="toggleLinks('esl-links')">
      ESL
    </div>
    <div id="esl-links" class="sub-buttons">
      <a href="resources/esl-i-have-a-pet.html" class="sub-button">I Have a Pet</a>
    </div>
  </main>

  <script>
    function toggleLinks(id) {
      const elem = document.getElementById(id);
      elem.style.display = (elem.style.display === 'block') ? 'none' : 'block';
    }
  </script>
</body>
</html>

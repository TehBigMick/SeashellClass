<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seashell Class Resources</title>

  <link rel="stylesheet" href="/styles.css">

  <style>
    /* ICON ANIMATION */
    .icon-anim {
      display: inline-block;
      animation: bounce 1.5s infinite;
      transform-origin: center;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Highlight new game button slightly */
    .highlight-new {
      background: #fff3e6;
      border: 2px solid #ffb347;
      border-radius: 14px;
      padding: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER CARD -->
  <div class="card hero-card">

    <div class="logo-wrap">
      <img src="/assets/seashell-banner.webp" alt="Seashell Class Banner" class="hero-logo">
    </div>

    <h1>📚 Seashell Class Resources</h1>
    <p class="subtitle">Choose a category below</p>

    <a href="/index.html">
      <button class="bubble-btn">⬅ Back to Homepage</button>
    </a>

  </div>

  <!-- PHONICS -->
  <div class="card">
    <button class="bubble-btn large-btn" onclick="toggleLinks('phonics-links')">
      🎵 Phonics
    </button>

    <div id="phonics-links" class="sub-buttons">

      <div style="display:flex; gap:10px; width:100%; justify-content:center; flex-wrap:wrap;">
        <a href="/resources/phonics-level1.html" class="sub-bubble">Level 1</a>
        <a href="/pirate-pat.html" class="sub-bubble">📖 Pirate Pat</a>
      </div>

      <div style="display:flex; gap:10px; width:100%; justify-content:center; flex-wrap:wrap;">
        <a href="/resources/phonics-level2.html" class="sub-bubble">Level 2</a>
        <a href="/dressing-up.html" class="sub-bubble">👗 Dressing Up</a>
      </div>

      <div style="display:flex; gap:10px; width:100%; justify-content:center; flex-wrap:wrap;">
        <a href="/resources/phonics-level3.html" class="sub-bubble">Level 3</a>
        <a href="/perfect-pet.html" class="sub-bubble">📖 The Perfect Pet</a>
      </div>

    </div>
  </div>

  <!-- ESL -->
  <div class="card">
    <button class="bubble-btn large-btn" onclick="toggleLinks('esl-links')">
      🐾 ESL
    </button>

    <div id="esl-links" class="sub-buttons">

      <a href="/resources/esl-i-have-a-pet.html" class="sub-bubble">
        I Have a Pet
      </a>

      <a href="/resources/supertato.html" class="sub-bubble">
        Supertato!
      </a>

      <!-- NEW GAME BUTTON -->
      <div class="highlight-new">

        <a href="/fruit-game.html" class="sub-bubble">

          <span class="icon-anim">🍓</span>
          Fruit & Veg Reveal Game

        </a>

      </div>

    </div>
  </div>

</div>

<script>
function toggleLinks(id) {
  const el = document.getElementById(id);
  el.style.display = (el.style.display === "flex") ? "none" : "flex";
}
</script>

</body>
</html>

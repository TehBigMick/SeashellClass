<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phonics Level 1</title>

  <!-- IMPORTANT: adjust path if needed -->
  <link rel="stylesheet" href="../styles.css">
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <img src="../assets/images/logo.png" class="logo">
    <h1>🌊 Phonics Level 1</h1>
  </div>

  <!-- PHONEMES -->
  <div class="card">
    <h2>🔤 Tap the Sounds</h2>

    <div class="phoneme-row">
      <span class="phoneme" onclick="playSound('s')">s</span>
      <span class="phoneme" onclick="playSound('a')">a</span>
      <span class="phoneme" onclick="playSound('t')">t</span>
      <span class="phoneme" onclick="playSound('p')">p</span>
      <span class="phoneme" onclick="playSound('i')">i</span>
      <span class="phoneme" onclick="playSound('n')">n</span>
      <span class="phoneme" onclick="playSound('m')">m</span>
      <span class="phoneme" onclick="playSound('d')">d</span>
    </div>
  </div>

  <!-- WORDS -->
  <div class="card">
    <h2>📖 Build the Words</h2>

    <div class="word-row">
      <span onclick="playSound('s')">s</span>
      <span onclick="playSound('a')">a</span>
      <span onclick="playSound('t')">t</span>
      <button class="bubble-btn" onclick="playWord('sat')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('s')">s</span>
      <span onclick="playSound('i')">i</span>
      <span onclick="playSound('t')">t</span>
      <button class="bubble-btn" onclick="playWord('sit')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('t')">t</span>
      <span onclick="playSound('a')">a</span>
      <span onclick="playSound('p')">p</span>
      <button class="bubble-btn" onclick="playWord('tap')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('p')">p</span>
      <span onclick="playSound('i')">i</span>
      <span onclick="playSound('n')">n</span>
      <button class="bubble-btn" onclick="playWord('pin')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('p')">p</span>
      <span onclick="playSound('a')">a</span>
      <span onclick="playSound('n')">n</span>
      <button class="bubble-btn" onclick="playWord('pan')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('m')">m</span>
      <span onclick="playSound('a')">a</span>
      <span onclick="playSound('t')">t</span>
      <button class="bubble-btn" onclick="playWord('mat')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('d')">d</span>
      <span onclick="playSound('i')">i</span>
      <span onclick="playSound('p')">p</span>
      <button class="bubble-btn" onclick="playWord('dip')">🔊</button>
    </div>

    <button class="bubble-btn" onclick="playBlend()">🔊 Listen & Blend</button>
  </div>

  <!-- GAME -->
  <div class="card">
    <h2>🎮 Tap the Sounds!</h2>

    <p id="game-word">Word: ---</p>

    <div id="game-letters" class="phoneme-row"></div>

    <p id="game-feedback"></p>

    <button class="bubble-btn" onclick="nextWord()">Next Word</button>
  </div>

  <!-- NAV -->
  <div class="section">
    <a href="level1-wordbank.html">
      <button class="bubble-btn game-btn">📚 Full Word Bank</button>
    </a>
  </div>

</div>

<script>
function playSound(letter) {
  new Audio("../assets/audio/phonemes/" + letter + ".mp3").play();
}

function playWord(word) {
  new Audio("../assets/audio/words/" + word + ".mp3").play();
}

function playBlend() {
  let seq = ["s","a","t"];
  let i = 0;

  function next() {
    if (i < seq.length) {
      let audio = new Audio("../assets/audio/phonemes/" + seq[i] + ".mp3");
      audio.play();
      i++;
      audio.onended = next;
    } else {
      playWord("sat");
    }
  }

  next();
}

/* GAME */
const words = ["sat","sit","tap","pin","pan","mat","dip"];
let currentWord = "";
let index = 0;

function nextWord() {
  currentWord = words[Math.floor(Math.random()*words.length)];
  index = 0;

  document.getElementById("game-word").innerText = "Word: " + currentWord;
  document.getElementById("game-feedback").innerText = "";

  let container = document.getElementById("game-letters");
  container.innerHTML = "";

  let shuffled = currentWord.split('').sort(()=>Math.random()-0.5);

  shuffled.forEach(letter => {
    let el = document.createElement("span");
    el.className = "phoneme";
    el.innerText = letter;

    el.onclick = () => check(letter, el);

    container.appendChild(el);
  });
}

function check(letter, el) {
  if(letter === currentWord[index]) {
    playSound(letter);
    el.style.background = "#66bb6a";
    index++;

    if(index === currentWord.length) {
      document.getElementById("game-feedback").innerText = "⭐ Great!";
      playWord(currentWord);
    }
  } else {
    el.style.background = "#ef5350";
    document.getElementById("game-feedback").innerText = "Try again!";
  }
}

nextWord();
</script>

</body>
</html>

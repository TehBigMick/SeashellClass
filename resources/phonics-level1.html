<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phonics Level 1</title>

  <!-- Always load from root so paths never break -->
  <link rel="stylesheet" href="/styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/scripts/site.js" defer></script>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1>🌊 Phonics Level 1</h1>
  </div>

  <!-- PHONEMES -->
  <div class="card">
    <h2>🔤 Tap the Sounds</h2>

    <div class="phoneme-row">
      <span class="phoneme" onclick="playSound('s')">s</span>
      <span class="phoneme" onclick="playSound('a')">a</span>
      <span class="phoneme" onclick="playSound('t')">t</span>
      <span class="phoneme" onclick="playSound('p')">p</span>
      <span class="phoneme" onclick="playSound('i')">i</span>
      <span class="phoneme" onclick="playSound('n')">n</span>
      <span class="phoneme" onclick="playSound('m')">m</span>
      <span class="phoneme" onclick="playSound('d')">d</span>
    </div>
  </div>

  <!-- WORDS -->
  <div class="card">
    <h2>📖 Blend the Words</h2>
    <p class="instruction">Tap each sound, then listen to the word.</p>

    <div class="word-row">
      <span onclick="playSound('s')">s</span>
      <span onclick="playSound('a')">a</span>
      <span onclick="playSound('t')">t</span>
      <button type="button" class="bubble-btn" onclick="playWord('sat')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('s')">s</span>
      <span onclick="playSound('i')">i</span>
      <span onclick="playSound('t')">t</span>
      <button type="button" class="bubble-btn" onclick="playWord('sit')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('t')">t</span>
      <span onclick="playSound('a')">a</span>
      <span onclick="playSound('p')">p</span>
      <button type="button" class="bubble-btn" onclick="playWord('tap')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('p')">p</span>
      <span onclick="playSound('i')">i</span>
      <span onclick="playSound('n')">n</span>
      <button type="button" class="bubble-btn" onclick="playWord('pin')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('p')">p</span>
      <span onclick="playSound('a')">a</span>
      <span onclick="playSound('n')">n</span>
      <button type="button" class="bubble-btn" onclick="playWord('pan')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('m')">m</span>
      <span onclick="playSound('a')">a</span>
      <span onclick="playSound('t')">t</span>
      <button type="button" class="bubble-btn" onclick="playWord('mat')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('d')">d</span>
      <span onclick="playSound('i')">i</span>
      <span onclick="playSound('p')">p</span>
      <button type="button" class="bubble-btn" onclick="playWord('dip')">🔊</button>
    </div>

  </div>

  <!-- NAV -->
  <div class="section">
    <a href="/phonics-game.html" class="bubble-btn">🎮 Build the Word</a>
    <a href="/resources/level1-wordbank.html" class="bubble-btn game-btn">📚 Full Word Bank</a>
  </div>

</div>

<script>
function playSound(letter) {
  new Audio("/assets/audio/phonemes/" + letter + ".mp3").play();
}

function playWord(word) {
  const audio = new Audio("/assets/audio/words/" + word + ".m4a");
  audio.play().catch(() => speakWord(word));
}

function speakWord(word) {
  if (!('speechSynthesis' in window)) return;
  const speech = new SpeechSynthesisUtterance(word);
  speech.lang = 'en-GB';
  speech.rate = 0.72;
  speechSynthesis.speak(speech);
}
</script>

</body>
</html>

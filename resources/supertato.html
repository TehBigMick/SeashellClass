<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supertato!</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
    }
    .flashcards-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .flashcard {
      background-color: #f1f1f1;
      border-radius: 10px;
      padding: 15px;
      width: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .flashcard img {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .flashcard span {
      margin-bottom: 8px;
      font-weight: bold;
    }
    .flashcard button {
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 16px;
    }
    .flashcard button:hover {
      background-color: #0b7dda;
    }
  </style>
</head>
<body>

  <h1>🥔 Supertato!</h1>
  <p>Click on an image to hear the word.</p>

  <div class="flashcards-container">

    <div class="flashcard">
      <img src="/assets/images/potato.webp" alt="Potato">
      <span>Potato</span>
      <button onclick="playAudio('potato')">🔊</button>
    </div>

    <div class="flashcard">
      <img src="/assets/images/carrot.webp" alt="Carrot">
      <span>Carrot</span>
      <button onclick="playAudio('carrot')">🔊</button>
    </div>

    <div class="flashcard">
      <img src="/assets/images/broccoli.webp" alt="Broccoli">
      <span>Broccoli</span>
      <button onclick="playAudio('broccoli')">🔊</button>
    </div>

    <div class="flashcard">
      <img src="/assets/images/pea.webp" alt="Pea">
      <span>Pea</span>
      <button onclick="playAudio('pea')">🔊</button>
    </div>

    <div class="flashcard">
      <img src="/assets/images/tomato.webp" alt="Tomato">
      <span>Tomato</span>
      <button onclick="playAudio('tomato')">🔊</button>
    </div>

    <div class="flashcard">
      <img src="/assets/images/cucumber.webp" alt="Cucumber">
      <span>Cucumber</span>
      <button onclick="playAudio('cucumber')">🔊</button>
    </div>

    <div class="flashcard">
      <img src="/assets/images/eggplant.webp" alt="Eggplant">
      <span>Eggplant</span>
      <button onclick="playAudio('eggplant')">🔊</button>
    </div>

    <div class="flashcard">
      <img src="/assets/images/watermelon.webp" alt="Watermelon">
      <span>Watermelon</span>
      <button onclick="playAudio('watermelon')">🔊</button>
    </div>

    <div class="flashcard">
      <img src="/assets/images/pear.webp" alt="Pear">
      <span>Pear</span>
      <button onclick="playAudio('pear')">🔊</button>
    </div>

    <div class="flashcard">
      <img src="/assets/images/grapefruit.webp" alt="Grapefruit">
      <span>Grapefruit</span>
      <button onclick="playAudio('grapefruit')">🔊</button>
    </div>

    <div class="flashcard">
      <img src="/assets/images/pineapple.webp" alt="Pineapple">
      <span>Pineapple</span>
      <button onclick="playAudio('pineapple')">🔊</button>
    </div>

    <div class="flashcard">
      <img src="/assets/images/strawberry.webp" alt="Strawberry">
      <span>Strawberry</span>
      <button onclick="playAudio('strawberry')">🔊</button>
    </div>

  </div>

  <script>
    function playAudio(word) {
      const audio = new Audio(`/assets/audio/words/${word}.m4a`);
      audio.play();
    }
  </script>

</body>
</html>

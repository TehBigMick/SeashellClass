<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Learn pet vocabulary with a song, picture cards and a listening game.">
  <title>I Have a Pet | Seashell Class</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/scripts/site.js" defer></script>
</head>
<body>
  <main class="page-shell" id="main-content">
    <section class="page-hero page-hero--compact"><div><span class="eyebrow">English topic · Pets</span><h1>I Have a Pet</h1><p class="page-hero__lead">Watch the song, tap the picture cards and practise “I have a…”.</p></div></section>
    <section class="section section--soft" aria-labelledby="song-heading"><div class="section-heading"><div><h2 id="song-heading">Sing together</h2><p>Listen once, then join in with the animal words.</p></div></div><video class="topic-video" controls preload="metadata"><source src="/assets/video/i-have-a-pet-song.mp4" type="video/mp4">Your browser does not support this video.</video></section>
    <section class="section" aria-labelledby="words-heading"><div class="section-heading"><div><h2 id="words-heading">Pet picture cards</h2><p>Tap a card to hear the word and a model sentence.</p></div><a class="button button--coral" href="/resources/esl-i-have-a-pet-game.html">Play Which Pet?</a></div><div class="resource-grid" id="pet-cards"></div></section>
  </main>
  <script>
    const pets = [['dog','dog.webp'],['cat','cat.webp'],['fish','fish.webp'],['bird','bird.webp'],['rabbit','rabbit.webp'],['hamster','hamster.webp'],['guinea pig','guinea-pig.webp']];
    const grid = document.getElementById('pet-cards');
    function speak(text) { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const speech = new SpeechSynthesisUtterance(text); speech.lang = 'en-GB'; speech.rate = .78; speechSynthesis.speak(speech); } }
    pets.forEach(([word,file]) => { const card = document.createElement('article'); card.className = 'resource-card'; card.innerHTML = `<div class="resource-card__media"><img src="/assets/animals/${file}" alt="${word}"></div><div class="resource-card__body"><h3>${word.replace(/\b\w/g, (letter) => letter.toUpperCase())}</h3><p>I have a ${word}.</p><button type="button" class="button button--small">🔊 Listen</button></div>`; card.querySelector('button').addEventListener('click', () => speak(`I have a ${word}.`)); grid.append(card); });
  </script>
</body>
</html>

<main style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%;">

  <!-- Song Video -->

    🎵 Play Song Video
  </div>
  <div id="song-video" class="video-container" style="display:none; margin:12px 0;">

      <span>Fish</span>

    🎮 Play Game
  </div>

</main>

<script>
function toggleDisplay(id) {
  const el = document.getElementById(id);
  el.style.display = (el.style.display === "none" || el.style.display === "") ? "flex" : "none";
}

// Example playAudio function — adjust if your audio folder differs
function playAudio(word) {
  const audio = new Audio(`../assets/audio/${word}.m4a`);
  audio.play();
}
</script>

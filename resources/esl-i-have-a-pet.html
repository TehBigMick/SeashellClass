<main style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%;">
  <!-- Song Video -->
  <div class="bubble-button" onclick="toggleDisplay('song-video')">
    🎵 Play Song Video
  </div>
  <div id="song-video" class="video-container">
    <video controls width="480">
      <source src="video/i-have-a-pet-song.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Flashcards -->
  <div class="bubble-button" onclick="toggleDisplay('flashcards')">
    🃏 Flashcards
  </div>
  <div id="flashcards" class="flashcards-container">
    <div class="flashcard">
      <img src="../assets/animals/dog.webp" alt="Dog">
      <span>Dog</span>
      <button onclick="playAudio('dog')">🔊</button>
    </div>
    <div class="flashcard">
      <img src="../assets/animals/cat.webp" alt="Cat">
      <span>Cat</span>
      <button onclick="playAudio('cat')">🔊</button>
    </div>
    <div class="flashcard">
      <img src="../assets/animals/fish.webp" alt="Fish">
      <span>Fish</span>
      <button onclick="playAudio('fish')">🔊</button>
    </div>
    <div class="flashcard">
      <img src="../assets/animals/bird.webp" alt="Bird">
      <span>Bird</span>
      <button onclick="playAudio('bird')">🔊</button>
    </div>
    <div class="flashcard">
      <img src="../assets/animals/rabbit.webp" alt="Rabbit">
      <span>Rabbit</span>
      <button onclick="playAudio('rabbit')">🔊</button>
    </div>
    <div class="flashcard">
      <img src="../assets/animals/hamster.webp" alt="Hamster">
      <span>Hamster</span>
      <button onclick="playAudio('hamster')">🔊</button>
    </div>
    <div class="flashcard">
      <img src="../assets/animals/guinea-pig.webp" alt="Guinea Pig">
      <span>Guinea Pig</span>
      <button onclick="playAudio('guinea-pig')">🔊</button>
    </div>
  </div>

  <!-- Sentence -->
  <div class="bubble-button" onclick="playAudio('sentence')">
    🗣️ Play Sentence
  </div>

  <!-- Game -->
  <div class="bubble-button" onclick="location.href='esl-i-have-a-pet-game.html'">
    🎮 Play Game
  </div>
</main>

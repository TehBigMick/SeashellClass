<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phonics Level 3</title>

  <!-- Root path ensures it works from /resources/ -->
  <link rel="stylesheet" href="/styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/scripts/site.js" defer></script>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1>🌊 Phonics Level 3</h1>
  </div>

  <!-- PHONEMES -->
  <div class="card">
    <h2>🔤 Tap the Sounds</h2>

    <div class="phoneme-row">
      <span class="phoneme" onclick="playSound('h')">h</span>
      <span class="phoneme" onclick="playSound('b')">b</span>
      <span class="phoneme" onclick="playSound('f')">f</span>
      <span class="phoneme" onclick="playSound('ff')">ff</span>
      <span class="phoneme" onclick="playSound('l')">l</span>
      <span class="phoneme" onclick="playSound('ll')">ll</span>
      <span class="phoneme" onclick="playSound('ss')">ss</span>
    </div>
  </div>

  <!-- WORDS -->
  <div class="card">
    <h2>📖 Blend the Words</h2>
    <p class="instruction">Tap each sound, then listen to the word.</p>

    <!-- WORD LIST -->

    <div class="word-row">
      <span onclick="playSound('b')">b</span>
      <span onclick="playSound('a')">a</span>
      <span onclick="playSound('d')">d</span>
      <button type="button" class="bubble-btn" onclick="playWord('bad')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('k')">k</span>
      <span onclick="playSound('i')">i</span>
      <span onclick="playSound('ss')">ss</span>
      <button type="button" class="bubble-btn" onclick="playWord('kiss')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('b')">b</span>
      <span onclick="playSound('e')">e</span>
      <span onclick="playSound('ll')">ll</span>
      <button type="button" class="bubble-btn" onclick="playWord('bell')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('b')">b</span>
      <span onclick="playSound('u')">u</span>
      <span onclick="playSound('g')">g</span>
      <button type="button" class="bubble-btn" onclick="playWord('bug')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('f')">f</span>
      <span onclick="playSound('o')">o</span>
      <span onclick="playSound('g')">g</span>
      <button type="button" class="bubble-btn" onclick="playWord('fog')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('f')">f</span>
      <span onclick="playSound('u')">u</span>
      <span onclick="playSound('ss')">ss</span>
      <button type="button" class="bubble-btn" onclick="playWord('fuss')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('h')">h</span>
      <span onclick="playSound('i')">i</span>
      <span onclick="playSound('ll')">ll</span>
      <button type="button" class="bubble-btn" onclick="playWord('hill')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('h')">h</span>
      <span onclick="playSound('a')">a</span>
      <span onclick="playSound('t')">t</span>
      <button type="button" class="bubble-btn" onclick="playWord('hat')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('m')">m</span>
      <span onclick="playSound('e')">e</span>
      <span onclick="playSound('ss')">ss</span>
      <button type="button" class="bubble-btn" onclick="playWord('mess')">🔊</button>
    </div>

    <div class="word-row">
      <span onclick="playSound('m')">m</span>
      <span onclick="playSound('i')">i</span>
      <span onclick="playSound('ll')">ll</span>
      <button type="button" class="bubble-btn" onclick="playWord('mill')">🔊</button>
    </div>

  </div>

  <!-- NAV -->
  <div class="section">
    <a href="/phonics-game.html" class="bubble-btn">🎮 Build the Word</a>
    <a href="/resources/level3-wordbank.html" class="bubble-btn game-btn">📚 Full Word Bank</a>
  </div>

</div>

<script>
function playSound(letter) {
  new Audio("/assets/audio/phonemes/" + letter + ".mp3").play();
}

function playWord(word) {
  const audio = new Audio("/assets/audio/words/" + word + ".m4a");
  audio.play().catch(() => {
    if ('speechSynthesis' in window) {
      const speech = new SpeechSynthesisUtterance(word);
      speech.lang = 'en-GB';
      speech.rate = 0.75;
      speechSynthesis.speak(speech);
    }
  });
}
</script>

</body>
</html>
